[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "placebolm"
version = "0.1.0"
description = "Causal Progress with Imperfect Placebos"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "PlaceboLM Development Team"},
]
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "scipy>=1.7",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
statsmodels = ["statsmodels>=0.13"]
dev = [
    "pytest>=7.0",
    "statsmodels>=0.13",
]

[tool.setuptools.packages.find]
include = ["placebolm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
